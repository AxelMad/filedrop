# Example: three device kinds and structured names like
#   p1234-3-421-0   panel          site 3, room 421, device 0
#   n1234-3-421-0   laptop   (or   m1234-3-421-0  all-in-one PC, in rooms that have one)
# A panel is paired with whichever of n.../m... is registered; a laptop/PC is
# paired with the p... panel with the same site/room/device number.
#
# This is the scheme filedrop 1.x had built in (with a fixed school number).
# Since 2.0 the scheme is configuration: put these three naming lines in every
# agent.conf when upgrading a 1.x fleet, with your own number.
ROLE=auto
HOSTNAME_PATTERN=^(?P<role>[pnm])[0-9]{4}-(?P<site>[0-9]+)-(?P<room>[0-9]+)-(?P<n>[0-9]+)$
PANEL_ROLES=p
CLIENT_ROLES=n m

# Addresses come from DHCP without reservations -> directory. Whether a laptop
# and its panel are in one subnet or in different ones is irrelevant: list all
# addresses of the directory server; every agent works out the rest.
RESOLVE_MODE=directory
DIRECTORY_URL=http://10.0.0.5:8781, http://172.16.0.5:8781
DIRECTORY_TOKEN=put-the-token-here
SHARED_FOLDER_NAME=Общая папка
