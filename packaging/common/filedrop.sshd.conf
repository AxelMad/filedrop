# Installed by filedrop to /etc/ssh/sshd_config.d/filedrop.conf
#
# The account "filedrop" can only receive files over SFTP into its own
# folder /opt/filedrop (chroot): no shell, no TTY, no forwarding. The key it
# accepts is therefore good for exactly one thing - dropping a file or folder
# into /opt/filedrop/inbox of this machine. Nothing else.
Match User filedrop
    ChrootDirectory /opt/filedrop
    ForceCommand internal-sftp
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PasswordAuthentication no
